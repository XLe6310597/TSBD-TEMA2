<div class="form-container">
  <h2>Registrar Estudiante</h2>

  <form [formGroup]="studentForm" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="nombre">Nombre</label>
      <input id="nombre" formControlName="nombre" type="text" placeholder="Ej: Ana" />
    </div>

    <div class="form-group">
      <label for="apellidoP">Apellido Paterno</label>
      <input id="apellidoP" formControlName="apellidoP" type="text" placeholder="Ej: García" />
    </div>

    <div class="form-group">
      <label for="apellidoM">Apellido Materno</label>
      <input id="apellidoM" formControlName="apellidoM" type="text" placeholder="Ej: López" />
    </div>

    <div class="form-group">
      <label for="cursoId">Curso ID</label>
      <input id="cursoId" formControlName="cursoId" type="number" placeholder="Ej: 101" />
    </div>

    <div class="button-group">
      <button type="submit" [disabled]="studentForm.invalid">Guardar</button>
      <button type="button" class="cancel" (click)="onCancel()">Cancelar</button>
    </div>
  </form>
</div>
